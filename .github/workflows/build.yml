name: Build Zahidiya Alarm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform folder if missing
        run: |
          if [ ! -d "android" ]; then
           flutter create --platforms=android --org com.zahidiya --project-name alarm temp_scaffold
            cp -r temp_scaffold/android ./android
            rm -rf temp_scaffold
          fi

      - name: Patch build.gradle
        run: python3 scripts/patch_gradle.py

      - name: Patch AndroidManifest.xml
        run: python3 scripts/patch_manifest.py

      - name: Patch settings.gradle kotlin version
        run: python3 scripts/patch_settings.py

      - name: Add Firebase config
        run: python3 scripts/patch_firebase.py

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zahidiya-alarm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
